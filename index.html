<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Hello English</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color"
      content="#222222">

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.box {
    background: white;
    padding: 20px;
    margin-top: 15px;
    border-radius: 12px;
}

textarea {
    width: 100%;
    height: 180px;
    font-size: 18px;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
}

input[type="text"] {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    box-sizing: border-box;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

input[type="file"] {
    display: none;
}

button {
    padding: 12px 18px;
    margin: 6px;
    font-size: 17px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#loadButton,
#saveButton,
#start {
    background: #222;
    color: white;
}

#ocrButton,
#cameraButton {
    background: #1976d2;
    color: white;
}

#addButton {
    background: #388e3c;
    color: white;
}

.navigation {
    text-align: center;
}

#sentence {
    font-size: 24px;
    line-height: 1.5;
    font-weight: bold;
}

#result {
    font-size: 20px;
    line-height: 1.5;
}

#score {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
}

#articleList {
    margin-top: 10px;
}

.article-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    margin-top: 8px;
    background: #f1f1f1;
    border-radius: 8px;
}

.article-name {
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    flex: 1;
}

.delete-button {
    background: #d32f2f;
    color: white;
    font-size: 14px;
    padding: 8px 12px;
}

#savedMessage {
    color: green;
    font-weight: bold;
}

#ocrStatus {
    margin-top: 10px;
    font-weight: bold;
    line-height: 1.5;
}

.image-buttons {
    text-align: center;
    margin-top: 10px;
}

</style>

</head>


<body>


<h1>Hello English</h1>


<!-- ============================= -->
<!-- BÀI CỦA TÔI -->
<!-- ============================= -->

<div class="box">

<h3>📚 Bài của tôi</h3>

<div id="articleList">
    Chưa có bài nào.
</div>

</div>


<!-- ============================= -->
<!-- NHẬP BÀI -->
<!-- ============================= -->

<div class="box">

<h3>1. Nhập bài</h3>

<input
    type="text"
    id="articleTitle"
    placeholder="Tên bài, ví dụ: Amazon Rainforest"
>


<textarea id="article">

The first print ran to only 3,000 copies. But the fruit book has been remarkably influential. It is used by local people to learn about the trees around them.

</textarea>

<br>


<button id="loadButton">
Nạp bài
</button>


<button id="saveButton">
💾 Lưu bài
</button>


<button id="addButton">
➕ Bài mới
</button>


<!-- ============================= -->
<!-- NẠP BÀI BẰNG ẢNH -->
<!-- ============================= -->

<div class="image-buttons">

<input
    type="file"
    id="galleryInput"
    accept="image/*"
    multiple
>


<input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
>


<button id="ocrButton">
🖼️ Chọn ảnh từ máy
</button>


<button id="cameraButton">
📷 Chụp ảnh
</button>

</div>


<div id="ocrStatus"></div>


<div id="savedMessage"></div>

</div>


<!-- ============================= -->
<!-- CÂU HIỆN TẠI -->
<!-- ============================= -->

<div class="box">

<div style="text-align:center;">

<span id="counter">
Chưa có bài
</span>

</div>


<br>


<div id="sentence">
Hãy nạp bài trước.
</div>


<br>


<button id="start">
🎤 Đọc câu này
</button>

</div>


<!-- ============================= -->
<!-- KẾT QUẢ -->
<!-- ============================= -->

<div class="box">

<h3>Anh đã đọc:</h3>


<div id="result">
Chưa đọc...
</div>


<br>


<div id="score">
-
</div>

</div>


<!-- ============================= -->
<!-- ĐIỀU HƯỚNG -->
<!-- ============================= -->

<div class="box navigation">

<button id="previous">
⬅ Câu trước
</button>


<button id="next">
Câu tiếp ➡
</button>

</div>


<!-- ============================= -->
<!-- TESSERACT OCR -->
<!-- ============================= -->

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
</script>


<script>


// =============================
// BIẾN
// =============================

let sentences = [];

let currentSentence = 0;

let currentArticleId = null;


// =============================
// NHẬN DIỆN GIỌNG NÓI
// =============================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const recognition =
    SpeechRecognition
    ? new SpeechRecognition()
    : null;


if (recognition) {

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;

}


// =============================
// ELEMENT
// =============================

const article =
    document.getElementById("article");


const articleTitle =
    document.getElementById("articleTitle");


const loadButton =
    document.getElementById("loadButton");


const saveButton =
    document.getElementById("saveButton");


const addButton =
    document.getElementById("addButton");


const articleList =
    document.getElementById("articleList");


const savedMessage =
    document.getElementById("savedMessage");


const sentence =
    document.getElementById("sentence");


const counter =
    document.getElementById("counter");


const startButton =
    document.getElementById("start");


const result =
    document.getElementById("result");


const score =
    document.getElementById("score");


const previousButton =
    document.getElementById("previous");


const nextButton =
    document.getElementById("next");


const ocrButton =
    document.getElementById("ocrButton");


const cameraButton =
    document.getElementById("cameraButton");


const galleryInput =
    document.getElementById("galleryInput");


const cameraInput =
    document.getElementById("cameraInput");


const ocrStatus =
    document.getElementById("ocrStatus");


// =============================
// LẤY DANH SÁCH BÀI
// =============================

function getArticles() {

    return JSON.parse(
        localStorage.getItem(
            "helloEnglishArticles"
        ) || "[]"
    );

}


// =============================
// LƯU DANH SÁCH BÀI
// =============================

function saveArticles(articles) {

    localStorage.setItem(
        "helloEnglishArticles",
        JSON.stringify(articles)
    );

}


// =============================
// HIỂN THỊ DANH SÁCH
// =============================

function renderArticleList() {

    const articles =
        getArticles();


    articleList.innerHTML = "";


    if (articles.length === 0) {

        articleList.innerHTML =
            "Chưa có bài nào.";

        return;

    }


    articles.forEach(
        function(item) {

            const div =
                document.createElement("div");

            div.className =
                "article-item";


            const name =
                document.createElement("div");

            name.className =
                "article-name";


            name.innerHTML =
                "📖 " + item.title;


            name.onclick =
                function() {

                    loadSavedArticle(
                        item.id
                    );

                };


            const deleteButton =
                document.createElement("button");


            deleteButton.className =
                "delete-button";


            deleteButton.innerHTML =
                "🗑️ Xóa";


            deleteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    deleteArticle(
                        item.id
                    );

                };


            div.appendChild(name);

            div.appendChild(
                deleteButton
            );


            articleList.appendChild(div);

        }
    );

}


// =============================
// LƯU BÀI
// =============================

saveButton.onclick =
    function() {

        const title =
            articleTitle.value.trim();


        const text =
            article.value.trim();


        if (!title) {

            alert(
                "Anh chưa nhập tên bài."
            );

            return;

        }


        if (!text) {

            alert(
                "Anh chưa nhập nội dung bài."
            );

            return;

        }


        const articles =
            getArticles();


        if (currentArticleId) {

            const index =
                articles.findIndex(
                    function(item) {

                        return (
                            item.id ===
                            currentArticleId
                        );

                    }
                );


            if (index !== -1) {

                articles[index].title =
                    title;

                articles[index].text =
                    text;

                articles[index].currentSentence =
                    currentSentence;

            }

        }

        else {

            const newArticle = {

                id: Date.now(),

                title: title,

                text: text,

                currentSentence:
                    currentSentence

            };


            currentArticleId =
                newArticle.id;


            articles.push(
                newArticle
            );

        }


        saveArticles(
            articles
        );


        localStorage.setItem(
            "helloEnglishLastArticle",
            String(currentArticleId)
        );


        renderArticleList();


        savedMessage.innerHTML =
            "✅ Đã lưu bài";


        setTimeout(
            function() {

                savedMessage.innerHTML =
                    "";

            },
            2000
        );

    };


// =============================
// NẠP BÀI
// =============================

loadButton.onclick =
    function() {

        loadArticleText(
            article.value,
            0
        );

    };


// =============================
// XỬ LÝ NỘI DUNG
// =============================

function loadArticleText(
    text,
    startSentence
) {

    text =
        text.trim();


    if (!text) {

        alert(
            "Anh chưa nhập bài."
        );

        return;

    }


    const foundSentences =
        text
        .replace(/\n+/g, " ")
        .match(
            /[^.!?]+[.!?]+|[^.!?]+$/g
        );


    if (!foundSentences) {

        alert(
            "Không tìm thấy câu."
        );

        return;

    }


    sentences =
        foundSentences.map(
            function(s) {

                return s.trim();

            }
        );


    if (
        startSentence < 0 ||
        startSentence >= sentences.length
    ) {

        startSentence = 0;

    }


    currentSentence =
        startSentence;


    showSentence();

}


// =============================
// HIỂN THỊ CÂU
// =============================

function showSentence() {

    if (sentences.length === 0) {

        return;

    }


    sentence.innerHTML =
        sentences[currentSentence];


    counter.innerHTML =
        "Câu " +
        (currentSentence + 1) +
        " / " +
        sentences.length;


    result.innerHTML =
        "Chưa đọc...";


    score.innerHTML =
        "-";


    saveCurrentPosition();

}


// =============================
// NHỚ VỊ TRÍ CÂU
// =============================

function saveCurrentPosition() {

    if (!currentArticleId) {

        return;

    }


    const articles =
        getArticles();


    const index =
        articles.findIndex(
            function(item) {

                return (
                    item.id ===
                    currentArticleId
                );

            }
        );


    if (index !== -1) {

        articles[index].currentSentence =
            currentSentence;


        saveArticles(
            articles
        );

    }

}


// =============================
// TẢI BÀI ĐÃ LƯU
// =============================

function loadSavedArticle(id) {

    const articles =
        getArticles();


    const item =
        articles.find(
            function(article) {

                return (
                    article.id === id
                );

            }
        );


    if (!item) {

        return;

    }


    currentArticleId =
        item.id;


    localStorage.setItem(
        "helloEnglishLastArticle",
        String(item.id)
    );


    articleTitle.value =
        item.title;


    article.value =
        item.text;


    loadArticleText(
        item.text,
        item.currentSentence || 0
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


// =============================
// XÓA BÀI
// =============================

function deleteArticle(id) {

    const articles =
        getArticles();


    const item =
        articles.find(
            function(article) {

                return (
                    article.id === id
                );

            }
        );


    if (!item) {

        return;

    }


    const confirmed =
        confirm(
            'Xóa bài "' +
            item.title +
            '"?'
        );


    if (!confirmed) {

        return;

    }


    const newArticles =
        articles.filter(
            function(article) {

                return (
                    article.id !== id
                );

            }
        );


    saveArticles(
        newArticles
    );


    if (
        currentArticleId === id
    ) {

        currentArticleId =
            null;

        articleTitle.value =
            "";

    }


    renderArticleList();

}


// =============================
// BÀI MỚI
// =============================

addButton.onclick =
    function() {

        currentArticleId =
            null;


        articleTitle.value =
            "";


        article.value =
            "";


        sentences = [];


        currentSentence = 0;


        counter.innerHTML =
            "Chưa có bài";


        sentence.innerHTML =
            "Hãy nhập bài mới.";


        result.innerHTML =
            "Chưa đọc...";


        score.innerHTML =
            "-";


        savedMessage.innerHTML =
            "";


        ocrStatus.innerHTML =
            "";


        articleTitle.focus();

    };


// =============================
// CHỌN ẢNH TỪ MÁY
// =============================

ocrButton.onclick =
    function() {

        galleryInput.click();

    };


// =============================
// CHỤP ẢNH
// =============================

cameraButton.onclick =
    function() {

        cameraInput.click();

    };


// =============================
// OCR NHIỀU ẢNH
// =============================

async function processImages(files) {

    if (!files || files.length === 0) {

        return;

    }


    ocrStatus.innerHTML =
        "🔍 Chuẩn bị nhận dạng " +
        files.length +
        " ảnh...";


    try {

        let allText = "";


        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            const file =
                files[i];


            ocrStatus.innerHTML =
                "🔍 Đang nhận dạng ảnh " +
                (i + 1) +
                "/" +
                files.length +
                "...";


            const ocrResult =
                await Tesseract.recognize(

                    file,

                    "eng",

                    {

                        logger:
                            function(info) {

                                if (
                                    info.status ===
                                    "recognizing text"
                                ) {

                                    const percent =
                                        Math.round(
                                            info.progress *
                                            100
                                        );


                                    ocrStatus.innerHTML =
                                        "🔍 Ảnh " +
                                        (i + 1) +
                                        "/" +
                                        files.length +
                                        " — " +
                                        percent +
                                        "%";

                                }

                            }

                    }

                );


            const text =
                ocrResult.data.text.trim();


            if (text) {

                if (allText) {

                    allText +=
                        "\n\n";

                }


                allText +=
                    text;

            }

        }


        if (!allText.trim()) {

            ocrStatus.innerHTML =
                "❌ Không nhận dạng được chữ. " +
                "Anh thử ảnh rõ hơn.";

            return;

        }


        // Đưa toàn bộ kết quả OCR vào bài

        article.value =
            allText;


        // Nếu chưa có tên bài
        // lấy tên ảnh đầu tiên

        if (
            !articleTitle.value.trim()
        ) {

            const firstFile =
                files[0];


            articleTitle.value =
                firstFile.name
                .replace(
                    /\.[^/.]+$/,
                    ""
                )
                .replace(
                    /[-_]+/g,
                    " "
                );

        }


        ocrStatus.innerHTML =
            "✅ Đã nhận dạng xong " +
            files.length +
            " ảnh. " +
            "Anh kiểm tra bài rồi bấm Nạp bài.";

    }


    catch(error) {

        console.error(error);


        ocrStatus.innerHTML =
            "❌ OCR lỗi. " +
            "Anh thử ảnh rõ hơn.";

    }

}


// =============================
// ẢNH TỪ THƯ VIỆN
// =============================

galleryInput.onchange =
    async function() {

        const files =
            Array.from(
                galleryInput.files
            );


        await processImages(files);


        galleryInput.value =
            "";

    };


// =============================
// ẢNH TỪ CAMERA
// =============================

cameraInput.onchange =
    async function() {

        const files =
            Array.from(
                cameraInput.files
            );


        await processImages(files);


        cameraInput.value =
            "";

    };


// =============================
// ĐỌC
// =============================

startButton.onclick =
    function() {

        if (!recognition) {

            alert(
                "Trình duyệt không hỗ trợ " +
                "nhận diện giọng nói."
            );


            return;

        }


        if (sentences.length === 0) {

            alert(
                "Anh hãy nạp bài trước."
            );


            return;

        }


        result.innerHTML =
            "🎧 Đang nghe...";


        score.innerHTML =
            "...";


        try {

            recognition.start();

        }

        catch(error) {

            console.log(error);

        }

    };


// =============================
// KẾT QUẢ GIỌNG NÓI
// =============================

if (recognition) {

    recognition.onresult =
        function(event) {

            const spokenText =
                event.results[0][0]
                .transcript;


            result.innerHTML =
                spokenText;


            calculateScore(

                sentences[currentSentence],

                spokenText

            );

        };


    recognition.onerror =
        function(event) {

            result.innerHTML =
                "Lỗi: " +
                event.error;

        };

}


// =============================
// CHẤM ĐIỂM
// =============================

function calculateScore(
    original,
    spoken
) {

    const originalWords =
        normalize(original)
        .split(" ");


    const spokenWords =
        normalize(spoken)
        .split(" ");


    let correct = 0;


    originalWords.forEach(
        function(word, index) {

            if (
                spokenWords[index] ===
                word
            ) {

                correct++;

            }

        }
    );


    const percentage =
        Math.round(

            correct /
            originalWords.length *
            100

        );


    score.innerHTML =
        percentage + "/100";

}


// =============================
// LÀM SẠCH TEXT
// =============================

function normalize(text) {

    return text

        .toLowerCase()

        .replace(
            /[.,!?;:'"]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


// =============================
// CÂU TRƯỚC
// =============================

previousButton.onclick =
    function() {

        if (
            sentences.length === 0
        ) {

            return;

        }


        if (
            currentSentence > 0
        ) {

            currentSentence--;


            showSentence();

        }

    };


// =============================
// CÂU TIẾP
// =============================

nextButton.onclick =
    function() {

        if (
            sentences.length === 0
        ) {

            return;

        }


        if (
            currentSentence <
            sentences.length - 1
        ) {

            currentSentence++;


            showSentence();

        }

    };


// =============================
// KHỞI ĐỘNG
// =============================

renderArticleList();


// =============================
// KHÔI PHỤC BÀI CUỐI
// =============================

const lastArticleId =
    localStorage.getItem(
        "helloEnglishLastArticle"
    );


if (lastArticleId) {

    loadSavedArticle(
        Number(lastArticleId)
    );

}


// =============================
// SERVICE WORKER
// =============================

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register("./sw.js")

                .then(
                    function() {

                        console.log(
                            "Hello English: " +
                            "Service Worker registered"
                        );

                    }
                )

                .catch(
                    function(error) {

                        console.log(
                            "Service Worker error:",
                            error
                        );

                    }
                );

        }
    );

}

</script>


</body>
</html>
